spring.application.name=mangalog

# Подключение к базе данных
# Запись ${DB_URL:...} значит: взять переменную окружения DB_URL,
# а если её нет, то взять то, что написано после двоеточия
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mangalog}
spring.datasource.username=${DB_USER:mangalog}
# у пароля значения по умолчанию нет специально, чтобы не хранить его в коде
spring.datasource.password=${DB_PASSWORD}

# Миграции
# Flyway при запуске сам выполняет новые файлы из папки db/migration
spring.flyway.enabled=true
