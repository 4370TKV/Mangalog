<!DOCTYPE html>
<!-- ЗАГЛУШКА для проверки бэка, Вика надо тут будет заменить своей страницей -->
<!-- Важно сохранить th:action, name="username", name="password", кнопку с th:formaction -->
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
<form th:action="@{/login}" method="post">
    <input name="username" placeholder="Логин" required>
    <input type="password" name="password" placeholder="Пароль" required>
    <button type="submit">Войти</button>
    <button type="submit" th:formaction="@{/register}">Зарегистрироваться</button>
</form>
</body>
</html>
