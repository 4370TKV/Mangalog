<!DOCTYPE html>
<!-- xmlns:th нужен, чтобы работали атрибуты Thymeleaf (th:text и т.д.) -->
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мангалог</title>
</head>
<body>
<div>
    <h1>Мангалог</h1>

    <!-- th:text подставляет значение userCount, которое положил HomeController
         Ноль внутри span виден, только если открыть файл без запуска приложения -->
    <p>
        БД подключена, пользователей: <span th:text="${userCount}">0</span>
    </p>
</div>
</body>
</html>
